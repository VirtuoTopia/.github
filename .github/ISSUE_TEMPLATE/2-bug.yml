name: Bug
description: Something behaves differently than expected.
title: "fix(<scope>): "
type: Bug
projects: ["VirtuoTopia/1"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context / Problem
      description: What happens, and what should happen instead.
    validations:
      required: true
  - type: textarea
    id: components
    attributes:
      label: Affected Java components
      description: Fully qualified class names, packages or file paths.
      placeholder: org.virtuotopia.* in src/main/java/org/virtuotopia/*
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / Technical details
      description: Steps or input, the failing command (e.g. a Gradle test command), stack trace.
      placeholder: ./gradlew :vt:test --tests 'org.virtuotopia.VTTest'
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, checkable outcomes.
      value: |
        - [ ] A regression test reproduces the bug and passes after the fix
        - [ ] 
    validations:
      required: true
